<div class="p-4 max-w-4xl mx-auto">
    <!-- Page Title -->
    <h2 class="text-2xl font-bold mb-4">View Submissions</h2>

    <!-- Loading State Message -->
    <div *ngIf="loading" class="text-center text-gray-500">
        Loading submissions...
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="text-center text-red-500">
        {{ error }}
    </div>

    <!-- No Submissions Found Message -->
    <div *ngIf="!loading && !error && submissions.length === 0" class="text-center text-gray-500">
        No submissions found.
    </div>

    <!-- Submissions List Container: flex with wrap -->
    <div class="flex flex-wrap gap-4">
        <!-- Individual Submission Card -->
        <div *ngFor="let submission of submissions"
            class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 flex flex-col justify-between"
            style="width: calc((100% / 3) - 1rem); min-height: 180px;">
            <!-- Submission Header: Name and Time with border-bottom -->
            <div class="flex justify-between items-center mb-2 border-b border-gray-300 dark:border-gray-600 pb-2">
                <div class="font-semibold text-lg text-gray-900 dark:text-gray-100">
                    {{ submission.name }}
                </div>
                <div class="text-sm text-gray-500 dark:text-gray-400">
                    Submitted: {{ submission.submitted_at ? timeAgo(submission.submitted_at) : 'Unknown time' }}
                </div>
            </div>

            <!-- Submission Message Preview -->
            <div class="text-gray-700 dark:text-gray-300 mt-2 flex-grow">
                {{ truncateMessage(submission.message) }}
            </div>
        </div>
    </div>
</div>
