<main class="max-w-md mx-auto mt-20 p-4 bg-white dark:bg-gray-800 rounded-md shadow">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-900 dark:text-gray-100">Submit Your Feedback</h1>

    <form (ngSubmit)="onSubmit()" [formGroup]="form" novalidate>
        <!-- Name -->
        <div class="mb-4">
            <label for="name" class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Name</label>
            <input id="name" type="text" formControlName="name"
                class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                [class.border-red-500]="errors.name" />
            <p *ngIf="errors.name" class="mt-1 text-red-600 text-sm">{{ errors.name }}</p>
        </div>

        <!-- Email -->
        <div class="mb-4">
            <label for="email" class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Email</label>
            <input id="email" type="email" formControlName="email"
                class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                [class.border-red-500]="errors.email" />
            <p *ngIf="errors.email" class="mt-1 text-red-600 text-sm">{{ errors.email }}</p>
        </div>

        <!-- Message -->
        <div class="mb-4">
            <label for="message" class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Message</label>
            <textarea id="message" rows="5" formControlName="message"
                class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                [class.border-red-500]="errors.message"></textarea>
            <p *ngIf="errors.message" class="mt-1 text-red-600 text-sm">{{ errors.message }}</p>
        </div>

        <!-- Submit button -->
        <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-semibold py-2 rounded transition-colors"
            [disabled]="submitting || Object.keys(errors).length > 0 || form.invalid">
            {{ submitting ? 'Submitting...' : 'Submit' }}
        </button>
    </form>

    <!-- Success/Error Messages -->
    <p *ngIf="successMessage" class="mt-4 text-green-600 font-semibold text-center">{{ successMessage }}</p>
    <p *ngIf="errorMessage" class="mt-4 text-red-600 font-semibold text-center">{{ errorMessage }}</p>
</main>
